[project]
name = "ke-box-calc-v2"
version = "2.0.0.dev2"
description = "KE | BOX CALC v2.0 modular calculation platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "psycopg[binary]==3.2.9",
  "pydantic-settings==2.10.1",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "ruff==0.12.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
