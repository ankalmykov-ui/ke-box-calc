<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KE | BOX CALC v0.7.1</title><link rel="manifest" href="/manifest.webmanifest">
<style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#182230}.top{background:#16324f;color:#fff;padding:16px 22px}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #dce3eb;border-radius:14px;padding:16px;margin-bottom:14px}h2{margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}label{font-size:12px;color:#667085}input,select,button{width:100%;padding:10px;border-radius:8px;border:1px solid #ccd5df;box-sizing:border-box}button{background:#2359a8;color:#fff;font-weight:700;cursor:pointer;margin-top:8px}.secondary{background:#e9eef6;color:#24466f}.result{background:#f8fafc;border:1px solid #dce3eb;border-radius:10px;padding:12px;margin-top:10px}.item{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;border-top:1px solid #e5e9ef;padding:8px 0}.muted{color:#667085;font-size:13px}.good{color:#16794b}.warn{color:#996000}.variant{padding:3px 0 3px 14px;font-size:13px}@media(max-width:760px){.grid,.item{grid-template-columns:1fr}}</style></head>
<body><div class="top"><b>KE | BOX CALC</b> <span>v0.7.1</span><div style="font-size:12px;opacity:.75">конфигурация ООО "ПК Руспак"</div></div><main class="wrap">
<section class="card"><h2>FEFCO 0201</h2><div class="grid"><div><label>Код</label><input id="code" value="BOX-001"></div><div><label>L, мм</label><input id="l" type="number" value="450"></div><div><label>B, мм</label><input id="b" type="number" value="326"></div><div><label>H, мм</label><input id="h" type="number" value="210"></div><div><label>Количество</label><input id="qty" type="number" value="1000"></div><div><label>Марка</label><input id="grade" value="T23"></div><div><label>Профиль</label><select id="profile"><option>B</option><option selected>C</option><option>E</option><option>BE</option><option>CE</option><option>BC</option></select></div><div><label>Цветов</label><input id="colors" type="number" value="1"></div></div><button onclick="addItem()">Добавить в заказ</button><button class="secondary" onclick="clearItems()">Очистить заказ и результат</button><div id="items" class="result muted">Пока нет изделий</div></section>
<section class="card"><h2>Расчёт</h2><div class="grid"><div><label>Доступные рулоны, мм</label><input id="rolls" value="2150,2100,2050"></div><div><label>Рабочая ширина ГА, мм</label><input id="gaWidth" type="number" value="2100"></div><div><label>Макс. ручьёв</label><input id="streams" type="number" value="5"></div><div><label>Прочие потери, %</label><input id="waste" type="number" value="0"></div></div><button onclick="calculate()">Рассчитать заказ</button><div id="result" class="result muted">Результат ещё не рассчитан</div></section>
<section class="card"><h2>Импорт сырья из 1С</h2><p class="muted">После проверки корректные строки можно сделать активными для текущего расчёта.</p><input id="onec" type="file" accept=".xlsx,.csv"><button onclick="preview1c()">Проверить файл 1С</button><button id="use1cBtn" class="secondary" onclick="use1c()" disabled>Использовать в расчёте</button><div id="onecResult" class="result muted">Файл не загружен</div></section>
</main><script>
const $=id=>document.getElementById(id);let order=[],lastResult=null,previewMaterials=[],sessionMaterials=[];
async function api(url,opt){const r=await fetch(url,opt),d=await r.json();if(!r.ok)throw new Error(d.detail||'Ошибка');return d}
function resetResult(){$('result').className='result muted';$('result').textContent='Результат ещё не рассчитан';lastResult=null}
function addItem(){order.push({code:$('code').value||`ITEM-${order.length+1}`,product_type:'0201',length_mm:+$('l').value,width_mm:+$('b').value,height_mm:+$('h').value,quantity:+$('qty').value,required_board_grade:$('grade').value.toUpperCase(),profile:$('profile').value,colors:+$('colors').value,die_cut:false});resetResult();renderItems()}
function removeItem(i){order.splice(i,1);resetResult();renderItems()}
function renderItems(){$('items').innerHTML=order.length?order.map((x,i)=>`<div class="item"><b>${x.code}</b><span>${x.length_mm}×${x.width_mm}×${x.height_mm}</span><span>${x.quantity} шт</span><button onclick="removeItem(${i})">×</button></div>`).join(''):'Пока нет изделий'}
function clearItems(){order=[];renderItems();resetResult()}
function materialPayload(r){return {code_1c:r.code_1c,variant_1c:r.variant_1c||null,name:r.name,gsm:+r.gsm,price_rub_t:+r.price_rub_t,stock_kg:r.stock_kg==null?null:+r.stock_kg,procurement_status:r.procurement_status||'active',supplier:r.supplier||null}}
function use1c(){sessionMaterials=previewMaterials.filter(r=>r.code_1c&&r.name&&+r.gsm>0&&+r.price_rub_t>0).map(materialPayload);$('onecResult').innerHTML=`<span class="good">Активно: <b>${sessionMaterials.length}</b> материалов 1С</span>`;resetResult()}
function strengthHtml(items){return items.map(x=>{const s=x.strength;if(!s||s.bct_estimated_kn==null)return `<div>${x.code}: BCT — нет данных</div>`;return `<div><b>${x.code}</b>: BCT ≈ <b>${s.bct_estimated_kn} кН</b> (${s.bct_estimated_kgf} кгс)${s.warning?` <span class="warn">${s.warning}</span>`:''}</div>`}).join('')}
function layoutHtml(x,i){const a=x.layout_alternatives||[];return `<div><b>Запуск ${i+1}</b>: рулон ${x.roll_width_mm} мм · обрезь ${x.edge_trim_pct}% · ${x.streams_total} руч.</div>`+(a.length?`<div class="muted">Варианты:</div>${a.map(v=>`<div class="variant">#${v.rank}${v.is_recommended?' ★':''}: ${v.roll_width_mm} мм · ${v.streams_total} руч. · отход ${v.total_waste_m2} м² · ${v.run_length_m} м</div>`).join('')}`:'')}
async function calculate(){try{if(!order.length)throw new Error('Добавьте изделие');const payload={items:order,roll_widths_mm:$('rolls').value.split(',').map(Number).filter(Boolean),working_width_mm:+$('gaWidth').value,max_streams:+$('streams').value,other_waste_pct:+$('waste').value,materials:sessionMaterials,candidates:[]};const d=await api('/api/calc/full',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});lastResult=d;const launches=d.corrugator.flatMap(g=>g.launches);$('result').className='result';$('result').innerHTML=`<b>${d.items.length} поз. · ${d.cost.net_order_area_m2} м² · v${d.version}</b><div><b>BCT (McKee, расчётный)</b>${strengthHtml(d.items)}</div><div><b>Раскрой</b>${launches.map(layoutHtml).join('')}</div><div class="muted">Активных материалов 1С: ${sessionMaterials.length}</div>`}catch(e){$('result').className='result warn';$('result').textContent=e.message}}
async function preview1c(){try{const f=$('onec').files[0];if(!f)throw new Error('Выберите файл');const fd=new FormData();fd.append('file',f);const d=await api('/api/import/1c/materials/preview',{method:'POST',body:fd});previewMaterials=d.rows||[];$('use1cBtn').disabled=!previewMaterials.length;$('onecResult').innerHTML=`Корректных строк: <b>${d.stats.rows_valid}</b>; замечаний: ${d.stats.issues}. Нажмите «Использовать в расчёте».`}catch(e){$('use1cBtn').disabled=true;$('onecResult').textContent=e.message}}
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
