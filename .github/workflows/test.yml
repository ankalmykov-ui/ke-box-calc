name: tests

on:
  push:
    branches: [main, v0.8-dev]
  pull_request:
    branches: [main]

# v0.8 development gate: main stays on the last accepted release until this passes.
jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Run tests
        shell: bash
        run: |
          set +e
          PYTHONPATH=. pytest -q 2>&1 | tee pytest-output.txt
          code=${PIPESTATUS[0]}
          echo "$code" > pytest-exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: |
            backend/pytest-output.txt
            backend/pytest-exit-code.txt
      - name: Fail if tests failed
        shell: bash
        run: |
          code=$(cat pytest-exit-code.txt)
          test "$code" -eq 0
