name: v2 CI

on:
  push:
    branches: [v2-dev]
  pull_request:
    branches: [v2-dev]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --dev --locked
      - run: uv run ruff check .
      - run: uv run pytest

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag ke-box-calc-v2:test .

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: boxcalc
          POSTGRES_PASSWORD: boxcalc
          POSTGRES_DB: boxcalc_v2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boxcalc -d boxcalc_v2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://boxcalc:boxcalc@localhost:5432/boxcalc_v2_test
      DATABASE_REQUIRED: "true"
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --dev --locked
      - run: uv run python -m ke_box_calc.db.migrator up
      - run: uv run python -m ke_box_calc.db.migrator status
      - run: uv run python -m ke_box_calc.db.migrator down
      - run: uv run python -m ke_box_calc.db.migrator up

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/v2-dev'
    needs: [quality, container, migrations]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      YC_REGISTRY_ID: crpdjisupq0qdshjp502
      YC_REPOSITORY: ke-box-calc-v2
      YC_CI_SERVICE_ACCOUNT_ID: ajeo882o9ucakl6drviv
    steps:
      - uses: actions/checkout@v4

      - name: Inspect non-secret OIDC claim identifiers
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          audience = f"https://github.com/{os.environ['GITHUB_REPOSITORY_OWNER']}"
          query = urllib.parse.urlencode({"audience": audience})
          request = urllib.request.Request(
              f"{os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']}&{query}",
              headers={
                  "Authorization": (
                      f"bearer {os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}"
                  )
              },
          )
          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          visible = {
              key: claims.get(key)
              for key in ("sub", "iss", "aud", "ref", "repository")
          }
          print(json.dumps(visible, sort_keys=True))
          PY

      - name: Get short-lived Yandex Cloud IAM token
        id: get-iam-token
        uses: docker://ghcr.io/yc-actions/yc-iam-token-fed:1.0.0
        with:
          yc-sa-id: ${{ env.YC_CI_SERVICE_ACCOUNT_ID }}

      - name: Log in to Yandex Container Registry
        uses: docker/login-action@v3
        with:
          registry: cr.yandex
          username: iam
          password: ${{ steps.get-iam-token.outputs.token }}

      - name: Build and push immutable staging image
        run: |
          image="cr.yandex/${YC_REGISTRY_ID}/${YC_REPOSITORY}:${GITHUB_SHA}"
          docker build --tag "${image}" .
          docker push "${image}"

      - name: Deploy staging revision
        uses: yc-actions/yc-sls-container-deploy@v5
        with:
          yc-sa-id: ${{ env.YC_CI_SERVICE_ACCOUNT_ID }}
          container-name: ke-box-calc-v2-staging
          folder-id: b1gvc92l93dufjs2hcpd
          revision-service-account-id: ajed288vbcj1iab4aljt
          revision-cores: 1
          revision-memory: 512Mb
          revision-core-fraction: 100
          revision-concurrency: 8
          revision-image-url: cr.yandex/${{ env.YC_REGISTRY_ID }}/${{ env.YC_REPOSITORY }}:${{ github.sha }}
          revision-execution-timeout: 30
          revision-env: |
            APP_ENV=staging
            APP_LOG_LEVEL=INFO
            DATABASE_REQUIRED=false
